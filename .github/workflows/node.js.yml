name: Full Stack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-26.04   
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webshop-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: webshop-frontend
        run: npm ci

      - name: Build frontend
        working-directory: webshop-frontend
        run: npm run build

      - name: Test frontend
        working-directory: webshop-frontend
        run: npm test --if-present

  backend:
    runs-on: ubuntu-26.04   
    needs: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webshop-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: webshop-backend
        run: npm ci

      - name: Build backend
        working-directory: webshop-backend
        run: npm run build --if-present

      - name: Test backend
        working-directory: webshop-backend
        run: npm test --if-present
