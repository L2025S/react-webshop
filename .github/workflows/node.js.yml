name: Full Stack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install frontend dependencies
        run: |
          cd webshop-frontend
          npm ci

      - name: Build frontend
        run: |
          cd webshop-frontend
          npm run build

      - name: Test frontend
        run: |
          cd webshop-frontend
          npm test --if-present

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install backend dependencies
        run: |
          cd webshop-backend
          npm ci

      - name: Build backend
        run: |
          cd webshop-backend
          npm run build --if-present

      - name: Test backend
        run: |
          cd webshop-backend
          npm test --if-present
